<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Back Strength</title>
<meta name="theme-color" content="#F7F2E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1B1A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg: #F7F2E9;
    --surface: #FFFFFF;
    --surface-2: #EEE6D8;
    --text: #2A2A2E;
    --muted: #756E63;
    --line: #E3D9C6;
    --accent: #7A1F2B;
    --accent-soft: #F1DEE0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E1B1A;
      --surface: #282422;
      --surface-2: #332E2B;
      --text: #F2EDE5;
      --muted: #B0A79A;
      --line: #3E3833;
      --accent: #D98A96;
      --accent-soft: #3A2429;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header.top {
    padding: calc(16px + env(safe-area-inset-top)) 16px 14px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  header.top .inner { max-width: 720px; margin: 0 auto; }
  header.top h1 { margin: 0; font-size: 20px; letter-spacing: 0.02em; }
  header.top .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  main { padding: 18px 0 24px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  p { line-height: 1.5; font-size: 15px; color: var(--text); }
  .muted { color: var(--muted); }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .note {
    background: var(--accent-soft);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .note p { margin: 0 0 8px; font-size: 14px; }
  .note p:last-child { margin-bottom: 0; }
  .pill {
    display: inline-block;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .pill.accent { background: var(--accent); color: var(--bg); }
  .exlist { display: flex; flex-direction: column; gap: 12px; }
  .ex {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    background: var(--surface);
  }
  .ex .name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .ex .scheme { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .ex .notes { color: var(--muted); font-size: 13px; margin-bottom: 10px; line-height: 1.4; }
  a.guide { display: inline-block; color: var(--accent); font-size: 12px; font-weight: 600; text-decoration: none; margin-bottom: 10px; }
  a.guide:active { opacity: 0.7; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .field { flex: 1; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%;
    font-size: 16px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--text);
    min-height: 44px;
    font-family: inherit;
  }
  .stat-row { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .stat .val { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .last { font-size: 12px; color: var(--muted); margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  ul.list { margin: 0; padding-left: 20px; }
  ul.list li { margin-bottom: 8px; font-size: 15px; line-height: 1.5; }
  button.primary {
    width: 100%;
    background: var(--accent);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    min-height: 48px;
    cursor: pointer;
    transition: transform .08s ease;
  }
  button.primary:active { transform: scale(.985); }
  button.ghost {
    width: 100%;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    min-height: 44px;
    cursor: pointer;
    margin-top: 8px;
  }
  button.ghost:active { transform: scale(.985); }
  .addex {
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 12px;
  }
  .switch { text-align: center; margin-top: 10px; }
  .switch a { display: inline-block; margin: 0 6px; }
  .switch a { color: var(--muted); font-size: 13px; text-decoration: underline; }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .history-item:last-child { border-bottom: none; }
  .history-item .date { font-weight: 600; font-size: 14px; }
  .history-item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .history-item .entries { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.5; }
  .del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 6px;
    min-height: 32px;
  }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(84px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 20;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }
  nav.tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    display: flex;
    z-index: 10;
  }
  nav.tabs a {
    flex: 1;
    text-align: center;
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    padding: 8px 4px;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    border-radius: 10px;
  }
  nav.tabs a .ic { font-size: 18px; }
  nav.tabs a.active { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<header class="top">
  <div class="inner">
    <h1 id="phaseTitle">Back Strength</h1>
    <div class="sub" id="phaseSub">Loading…</div>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="toast" id="toast"></div>

<nav class="tabs">
  <a href="#/today" data-route="today"><span class="ic">✅</span>Today</a>
  <a href="#/program" data-route="program"><span class="ic">📋</span>Program</a>
  <a href="#/history" data-route="history"><span class="ic">📈</span>History</a>
  <a href="#/roadmap" data-route="roadmap"><span class="ic">🗺️</span>Roadmap</a>
</nav>

<script>
(function () {
  "use strict";

  var LOG_KEY = "charmaineBackLog_v1";
  var CUSTOM_KEY = "charmaineBackCustom_v1";
  var DATA = null;

  function loadLog() {
    try {
      var raw = localStorage.getItem(LOG_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveLog(log) {
    try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch (e) {}
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtDate(iso) {
    var d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }

  function todayISO() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (day < 10 ? "0" + day : day);
  }

  // Sessions that make up the A/B rotation. Log-only sessions (physio) sit outside it.
  function rotation() {
    if (DATA.rotation && DATA.rotation.length) return DATA.rotation;
    return Object.keys(DATA.workouts).filter(function (k) { return !DATA.workouts[k].logOnly; });
  }

  function rotationLog(log) {
    var rot = rotation();
    return log.filter(function (s) { return rot.indexOf(s.workout) !== -1; });
  }

  function nextWorkoutLetter(log) {
    var rot = rotation();
    var done = rotationLog(log);
    if (!done.length) return rot[0];
    var idx = rot.indexOf(done[done.length - 1].workout);
    return rot[(idx + 1) % rot.length];
  }

  // Exercises added from the phone, so the session log stays useful without a republish.
  function loadCustom() {
    try {
      var raw = localStorage.getItem(CUSTOM_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveCustom(map) {
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(map)); } catch (e) {}
  }
  function customFor(letter) {
    var list = loadCustom()[letter] || [];
    return list.map(function (name) {
      return { name: name, scheme: "Added by you", notes: "", track: "band", custom: true };
    });
  }

  function lastEntryFor(log, exerciseName) {
    for (var i = log.length - 1; i >= 0; i--) {
      var entries = log[i].entries || [];
      for (var j = 0; j < entries.length; j++) {
        if (entries[j].name === exerciseName) {
          var found = entries[j];
          found._date = log[i].date;
          return found;
        }
      }
    }
    return null;
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  // ---------- routes ----------

  function renderToday() {
    var log = loadLog();
    var letter = (window._forceWorkout) || nextWorkoutLetter(log);
    var w = DATA.workouts[letter];
    var exercises = w.exercises.concat(customFor(letter));
    var doneCount = rotationLog(log).length;
    var sessionNum = doneCount + 1;
    var weekApprox = Math.floor(doneCount / (DATA.sessionsPerWeek || 3)) + 1;

    var html = "";
    if (w.logOnly) {
      html += '<div class="pill">Log only · physio sets the plan</div>';
    } else {
      html += '<div class="pill accent">Session ' + sessionNum + ' · ~Week ' + weekApprox + '</div>';
    }
    html += '<h2>' + esc(w.label) + ' — ' + esc(w.name) + '</h2>';
    html += '<p class="muted" style="margin-top:-6px">' + esc(w.intro || "Log what you actually did — sets, reps and which band, or seconds held. Leave anything blank you skipped.") + '</p>';

    html += '<div class="exlist" id="exlist">';
    exercises.forEach(function (ex, i) {
      var last = lastEntryFor(log, ex.name);
      html += '<div class="ex" data-idx="' + i + '">';
      html += '<div class="name">' + esc(ex.name) + '</div>';
      html += '<div class="scheme">' + (ex.scheme ? esc(ex.scheme) : ex.sets + ' × ' + esc(ex.reps)) + '</div>';
      if (ex.notes) { html += '<div class="notes">' + esc(ex.notes) + '</div>'; }
      if (ex.custom) { html += '<a class="guide" href="#" data-remove="' + esc(ex.name) + '">Remove this exercise ›</a>'; }
      if (ex.guide) {
        html += '<a class="guide" href="' + esc(ex.guide) + '" target="_blank" rel="noopener">How to do this ›</a>';
      }

      var setsPh = (last && last.sets != null) ? last.sets : (ex.sets != null ? ex.sets : "—");
      if (ex.track === "weight") {
        html += '<div class="row">';
        html += '<div class="field"><label>Sets</label><input type="number" inputmode="numeric" step="1" min="0" data-field="sets" placeholder="' + setsPh + '"></div>';
        html += '<div class="field"><label>Weight (kg)</label><input type="number" inputmode="decimal" step="0.5" min="0" data-field="weight" placeholder="' + (last && last.weight != null ? last.weight : "—") + '"></div>';
        html += '<div class="field"><label>Reps</label><input type="number" inputmode="numeric" step="1" min="0" data-field="reps" placeholder="' + (last && last.reps != null ? last.reps : "—") + '"></div>';
        html += '</div>';
        if (last && last.weight != null) {
          html += '<div class="last">Last time: ' + (last.sets != null ? last.sets + ' × ' : '') + last.weight + 'kg × ' + (last.reps != null ? last.reps : "?") + ' (' + fmtDate(last._date) + ')</div>';
        }
      } else if (ex.track === "band") {
        var bands = ["Light", "Medium", "Heavy"];
        html += '<div class="row">';
        html += '<div class="field"><label>Sets</label><input type="number" inputmode="numeric" step="1" min="0" data-field="sets" placeholder="' + setsPh + '"></div>';
        html += '<div class="field"><label>Reps done</label><input type="number" inputmode="numeric" step="1" min="0" data-field="reps" placeholder="' + (last && last.reps != null ? last.reps : "—") + '"></div>';
        html += '<div class="field"><label>Band</label><select data-field="band"><option value="">—</option>' + bands.map(function (b) {
          return '<option' + (last && last.band === b ? ' selected' : '') + '>' + b + '</option>';
        }).join("") + '</select></div>';
        html += '</div>';
        if (last && last.reps != null) {
          html += '<div class="last">Last time: ' + (last.sets != null ? last.sets + ' × ' : '') + last.reps + ' reps' + (last.band ? ' · ' + last.band + ' band' : '') + ' (' + fmtDate(last._date) + ')</div>';
        }
      } else if (ex.track === "time") {
        html += '<div class="row">';
        html += '<div class="field"><label>Sets</label><input type="number" inputmode="numeric" step="1" min="0" data-field="sets" placeholder="' + setsPh + '"></div>';
        html += '<div class="field"><label>Seconds held</label><input type="number" inputmode="numeric" step="1" min="0" data-field="seconds" placeholder="' + (last && last.seconds != null ? last.seconds : "—") + '"></div>';
        html += '</div>';
        if (last && last.seconds != null) {
          html += '<div class="last">Last time: ' + (last.sets != null ? last.sets + ' × ' : '') + last.seconds + 's (' + fmtDate(last._date) + ')</div>';
        }
      } else {
        html += '<div class="row">';
        html += '<div class="field"><label>Sets</label><input type="number" inputmode="numeric" step="1" min="0" data-field="sets" placeholder="' + setsPh + '"></div>';
        html += '<div class="field"><label>Reps done</label><input type="number" inputmode="numeric" step="1" min="0" data-field="reps" placeholder="' + (last && last.reps != null ? last.reps : "—") + '"></div>';
        html += '</div>';
        if (last && last.reps != null) {
          html += '<div class="last">Last time: ' + (last.sets != null ? last.sets + ' × ' : '') + last.reps + ' reps (' + fmtDate(last._date) + ')</div>';
        }
      }
      html += '</div>';
    });
    html += '</div>';

    html += '<div class="addex"><div class="field"><label>Add an exercise to this session</label>';
    html += '<input type="text" id="newExName" placeholder="e.g. Bird dog"></div>';
    html += '<button class="ghost" id="addEx">Add</button></div>';

    html += '<button class="primary" id="saveSession" style="margin-top:6px">Save ' + esc(w.label) + '</button>';
    html += '<div class="switch">' + Object.keys(DATA.workouts).filter(function (k) {
      return k !== letter;
    }).map(function (k) {
      return '<a href="#" class="switchTo" data-letter="' + k + '">Log ' + esc(DATA.workouts[k].label) + ' instead</a>';
    }).join("") + '</div>';

    var app = document.getElementById("app");
    app.innerHTML = html;

    app.querySelectorAll(".switchTo").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        window._forceWorkout = a.getAttribute("data-letter");
        renderToday();
      });
    });

    app.querySelectorAll("[data-remove]").forEach(function (a) {
      a.addEventListener("click", function (e) {
        e.preventDefault();
        var name = a.getAttribute("data-remove");
        var map = loadCustom();
        map[letter] = (map[letter] || []).filter(function (n) { return n !== name; });
        saveCustom(map);
        window._forceWorkout = letter;
        renderToday();
        toast("Exercise removed");
      });
    });

    document.getElementById("addEx").addEventListener("click", function () {
      var name = (document.getElementById("newExName").value || "").trim();
      if (!name) return;
      var clash = exercises.some(function (ex) { return ex.name.toLowerCase() === name.toLowerCase(); });
      if (clash) { toast("Already in this session"); return; }
      var map = loadCustom();
      map[letter] = (map[letter] || []).concat([name]);
      saveCustom(map);
      window._forceWorkout = letter;
      renderToday();
      toast("Exercise added");
    });

    document.getElementById("saveSession").addEventListener("click", function () {
      var entries = [];
      var nodes = document.querySelectorAll("#exlist .ex");
      nodes.forEach(function (node) {
        var idx = parseInt(node.getAttribute("data-idx"), 10);
        var ex = exercises[idx];
        var entry = { name: ex.name, track: ex.track };
        var has = false;
        var setsVal = node.querySelector('[data-field="sets"]').value;
        if (setsVal !== "") { entry.sets = parseInt(setsVal, 10); has = true; }
        if (ex.track === "weight") {
          var weight = node.querySelector('[data-field="weight"]').value;
          var reps = node.querySelector('[data-field="reps"]').value;
          if (weight !== "") { entry.weight = parseFloat(weight); has = true; }
          if (reps !== "") { entry.reps = parseInt(reps, 10); has = true; }
        } else if (ex.track === "band") {
          var br = node.querySelector('[data-field="reps"]').value;
          var bb = node.querySelector('[data-field="band"]').value;
          if (br !== "") { entry.reps = parseInt(br, 10); has = true; }
          if (bb !== "") { entry.band = bb; has = true; }
        } else if (ex.track === "time") {
          var sec = node.querySelector('[data-field="seconds"]').value;
          if (sec !== "") { entry.seconds = parseInt(sec, 10); has = true; }
        } else {
          var r = node.querySelector('[data-field="reps"]').value;
          if (r !== "") { entry.reps = parseInt(r, 10); has = true; }
        }
        if (has) entries.push(entry);
      });

      var log = loadLog();
      var session = { date: todayISO(), workout: letter, entries: entries };
      log.push(session);
      saveLog(log);
      window._forceWorkout = null;
      toast("Session saved");
      renderToday();
    });
  }

  function renderProgram() {
    var html = "";
    html += '<div class="card"><h2>The big picture</h2>';
    DATA.bigPicture.forEach(function (p) { html += "<p>" + esc(p) + "</p>"; });
    html += "</div>";

    html += '<div class="note"><h2 style="margin-bottom:8px">' + esc(DATA.constraintsTitle || "Read this first") + '</h2>';
    DATA.constraints.forEach(function (p) { html += "<p>" + esc(p) + "</p>"; });
    html += "</div>";

    html += '<div class="card"><h2>How this works</h2><ul class="list">';
    DATA.howItWorks.forEach(function (b) { html += "<li>" + esc(b) + "</li>"; });
    html += "</ul></div>";

    Object.keys(DATA.workouts).forEach(function (letter) {
      var w = DATA.workouts[letter];
      html += '<div class="card"><h2>' + esc(w.label) + ' — ' + esc(w.name) + '</h2>';
      if (w.intro) { html += '<p class="muted" style="font-size:14px">' + esc(w.intro) + '</p>'; }
      html += '<table><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th></tr></thead><tbody>';
      w.exercises.forEach(function (ex) {
        var scheme = ex.scheme
          ? '<td colspan="2">' + esc(ex.scheme) + '</td>'
          : '<td>' + ex.sets + '</td><td>' + esc(ex.reps) + '</td>';
        html += '<tr><td>' + esc(ex.name) + '<div class="muted" style="font-size:12px;margin-top:2px">' + esc(ex.notes) + '</div>' + (ex.guide ? '<a class="guide" href="' + esc(ex.guide) + '" target="_blank" rel="noopener">How to do this ›</a>' : '') + '</td>' + scheme + '</tr>';
      });
      html += '</tbody></table></div>';
    });

    if (DATA.conditioning && DATA.conditioning.length) {
      html += '<div class="card"><h2>' + esc(DATA.conditioningTitle || "More") + '</h2>';
      DATA.conditioning.forEach(function (p) { html += "<p>" + esc(p) + "</p>"; });
      html += "</div>";
    }

    document.getElementById("app").innerHTML = html;
  }

  function renderHistory() {
    var log = loadLog().slice().reverse();
    var html = "";
    if (!log.length) {
      html = '<div class="empty">No sessions logged yet.<br>Head to Today to log your first one.</div>';
    } else {
      html += '<div class="card">';
      log.forEach(function (session, revIdx) {
        var realIdx = log.length - 1 - revIdx;
        var w = DATA.workouts[session.workout];
        html += '<div class="history-item">';
        html += '<div style="flex:1">';
        html += '<div class="date">' + esc(w ? w.label : session.workout) + ' — ' + esc(w ? w.name : "") + '</div>';
        html += '<div class="meta">' + fmtDate(session.date) + '</div>';
        if (session.entries && session.entries.length) {
          html += '<div class="entries">' + session.entries.map(function (e) {
            var setsPre = e.sets != null ? e.sets + ' × ' : '';
            if (e.track === "weight") return esc(e.name) + ": " + setsPre + (e.weight != null ? e.weight + "kg" : "—") + (e.reps != null ? " × " + e.reps : "");
            if (e.track === "band") return esc(e.name) + ": " + setsPre + (e.reps != null ? e.reps + " reps" : "—") + (e.band ? " · " + esc(e.band) + " band" : "");
            if (e.track === "time") return esc(e.name) + ": " + setsPre + (e.seconds != null ? e.seconds + "s" : "—");
            return esc(e.name) + ": " + setsPre + (e.reps != null ? e.reps + " reps" : "—");
          }).join("<br>") + '</div>';
        } else {
          html += '<div class="entries muted">Nothing logged for this session</div>';
        }
        html += '</div>';
        html += '<button class="del" data-real-idx="' + realIdx + '">Delete</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    var app = document.getElementById("app");
    app.innerHTML = html;
    app.querySelectorAll(".del").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!confirm("Delete this session?")) return;
        var idx = parseInt(btn.getAttribute("data-real-idx"), 10);
        var log = loadLog();
        log.splice(idx, 1);
        saveLog(log);
        renderHistory();
        toast("Session deleted");
      });
    });
  }

  function renderRoadmap() {
    var html = "";
    html += '<div class="card"><h2>' + DATA.schedule.length + '-week schedule</h2>';
    html += '<table><thead><tr><th>Week</th><th>Rotation</th></tr></thead><tbody>';
    DATA.schedule.forEach(function (row) {
      html += '<tr><td>' + row.week + '</td><td>' + esc(row.rotation) + (row.note ? '<div class="muted" style="font-size:12px;margin-top:2px">' + esc(row.note) + '</div>' : '') + '</td></tr>';
    });
    html += '</tbody></table></div>';

    html += '<div class="card"><h2>Where this goes next</h2>';
    DATA.roadmap.forEach(function (r) {
      html += '<div style="margin-bottom:14px"><div style="font-weight:600;font-size:14px">' + esc(r.phase) + ' — <span class="muted" style="font-weight:400">' + esc(r.trigger) + '</span></div><p style="margin-top:6px">' + esc(r.text) + '</p></div>';
    });
    html += '</div>';

    html += '<div class="card"><h2>A few notes</h2><ul class="list">';
    DATA.notes.forEach(function (n) { html += "<li>" + esc(n) + "</li>"; });
    html += '</ul></div>';

    document.getElementById("app").innerHTML = html;
  }

  var ROUTES = { today: renderToday, program: renderProgram, history: renderHistory, roadmap: renderRoadmap };

  function route() {
    var hash = location.hash.replace(/^#\/?/, "") || "today";
    var name = hash.split("/")[0];
    if (!ROUTES[name]) name = "today";
    window._forceWorkout = null;
    ROUTES[name]();
    document.querySelectorAll("nav.tabs a").forEach(function (a) {
      a.classList.toggle("active", a.getAttribute("data-route") === name);
    });
    window.scrollTo(0, 0);
  }

  window.addEventListener("hashchange", route);

  fetch("./data.json?v=" + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      DATA = data;
      document.getElementById("phaseTitle").textContent = (data.appName || "Back Strength") + " — " + data.phase;
      document.getElementById("phaseSub").textContent = data.tagline + " · updated " + fmtDate(data.updated);
      route();
    })
    .catch(function (err) {
      document.getElementById("app").innerHTML = '<div class="empty">Could not load the program data. Check your connection and reload.</div>';
      console.error(err);
    });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("./sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
